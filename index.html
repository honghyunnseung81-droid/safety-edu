<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>안전교육</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="안전교육">
<style>
  html, body { margin: 0; height: 100%; background: #fff; font-family: system-ui, sans-serif; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #fff; transition: opacity .3s; }
  #splash img { width: 160px; }
  #splash p { color: #5b6270; margin: 0; font-size: 17px; text-align: center; padding: 0 24px; }
  /* 카톡·네이버 등 앱 안 브라우저 안내 (그림 없이 큰 글씨) */
  #inapp { position: fixed; inset: 0; background: #fff; display: none; flex-direction: column; justify-content: center; padding: 28px 22px; z-index: 10; }
  #inapp h1 { font-size: 26px; line-height: 1.4; margin: 0 0 18px; color: #1a1a1a; }
  #inapp .step { font-size: 24px; line-height: 1.5; font-weight: 700; color: #d71920; margin: 0 0 18px; }
  #inapp p { font-size: 18px; line-height: 1.6; color: #333; margin: 0 0 14px; }
  #inapp .my { font-size: 16px; color: #5b6270; }
  #inapp button { font: inherit; font-size: 20px; font-weight: 700; border: 0; border-radius: 12px; min-height: 58px; margin: 8px 0; }
  #inapp .go { background: #d71920; color: #fff; }
  #inapp .stay { background: none; color: #5b6270; text-decoration: underline; font-size: 16px; font-weight: 400; min-height: 44px; }
</style>
</head>
<body>
<div id="splash"><img src="logo.png" alt=""><p id="splash-msg">안전교육을 여는 중…</p></div>
<div id="inapp">
  <h1 id="ia-title">이 화면에서는 홈 화면에 추가할 수 없어요</h1>
  <div class="step" id="ia-step"></div>
  <p id="ia-why">휴대폰 기본 브라우저로 열어야 홈 화면 아이콘을 만들 수 있습니다.</p>
  <p class="my" id="ia-my"></p>
  <button class="go" id="ia-go" style="display:none"></button>
  <button class="stay" id="ia-stay">그래도 여기서 계속 보기</button>
</div>
<script>
/* ▼ 직원용 웹앱 주소 (Apps Script "배포 → 웹 앱" 주소). 계정을 옮기면 이 한 줄만 바꾸면 됩니다. */
var APP_URL = 'https://script.google.com/macros/s/AKfycbwvtwd4YRjoIOTvfhJR-ZTV9-vJWeaFPJzvKyTc-hGuEPjDvIWlnopUKZz-1JSxAS7l/exec';

/* 웹앱 안쪽 화면이 로그인 표·언어를 이 페이지(홈 화면 아이콘 쪽)에 맡겨 둡니다. */
var APP_ORIGIN = /^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/;
var KEYS = ['token', 'lang', 'a2hs', 'k'];
function ls(op, k, v) {
  try {
    if (op === 'get') return localStorage.getItem('kern_' + k);
    if (op === 'set') return localStorage.setItem('kern_' + k, v);
    return localStorage.removeItem('kern_' + k);
  } catch (e) { return null; }
}

/* 집체교육 서명 QR(?att=회차.30초칸.확인값 — 30초마다 바뀜): 앱에 한 번 넘기고 주소창에서는 지움
   (홈 화면 아이콘 주소에 남으면 아이콘을 열 때마다 참석 확인을 시도하게 되므로) */
var ATT = (location.search.match(/[?&]att=([A-Za-z0-9._-]{8,120})/) || [])[1] || '';
var ATT_IN = ATT; // 바깥 브라우저로 넘길 때 다시 붙이려고 보관

/* 개인 QR 주소(?k=개인코드): 이 휴대폰에 기억하고, 주소창에도 남겨 둠.
   주소창에 남아 있어야 "홈 화면에 추가"한 아이콘도 같은 주소로 열림
   (아이폰은 홈 화면 앱의 저장 공간이 사파리와 따로라서 주소가 유일한 연결 고리) */
(function () {
  var m = location.search.match(/[?&]k=([A-Za-z0-9]{16,64})/);
  if (m) {
    if (ls('get', 'k') !== m[1]) ls('del', 'token'); // 다른 사람 쪽지(또는 새 쪽지)면 이전 로그인 표는 버림
    ls('set', 'k', m[1]);
  }
  var k = ls('get', 'k');
  if ((!m && k) || ATT) { // 주소를 "?k=개인코드"(없으면 빈 주소)로 정리 — att는 빼고 k는 남김
    try { history.replaceState(null, '', location.pathname + (k ? '?k=' + k : '')); } catch (e) {}
  }
})();
/* 홈 화면 설치(안드로이드 크롬): 설치 창은 이 페이지에서만 띄울 수 있어서, 웹앱의 [홈 화면에 추가] 버튼과 메시지로 연결 */
var installEvt = null, appWin = null, appOrigin = '';
function tellApp(msg) { if (appWin) try { appWin.postMessage(msg, appOrigin); } catch (e) {} }
window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); installEvt = e; tellApp({ kern: 'installable' }); });
window.addEventListener('appinstalled', function () { installEvt = null; tellApp({ kern: 'installed' }); });

window.addEventListener('message', function (ev) {
  if (!APP_ORIGIN.test(ev.origin) || !ev.data || !ev.source) return;
  var m = ev.data;
  if (m.kern === 'get') {
    appWin = ev.source; appOrigin = ev.origin;
    var data = {};
    KEYS.forEach(function (k) { var v = ls('get', k); if (v) data[k] = v; });
    var standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    ev.source.postMessage({ kern: 'data', data: data, standalone: standalone, installable: !!installEvt, inApp: inAppKind(navigator.userAgent), att: ATT }, ev.origin);
    ATT = ''; // 한 번만
    document.getElementById('splash').style.opacity = 0;
    setTimeout(function () { document.getElementById('splash').style.display = 'none'; }, 300);
  } else if (m.kern === 'set' && KEYS.indexOf(m.key) >= 0) {
    ls('set', m.key, String(m.value));
  } else if (m.kern === 'del' && KEYS.indexOf(m.key) >= 0) {
    ls('del', m.key);
    if (m.key === 'k') { try { history.replaceState(null, '', location.pathname); } catch (e) {} } // 무효가 된 QR 주소 지우기
  } else if (m.kern === 'install') {
    if (!installEvt) { tellApp({ kern: 'installResult', outcome: 'unavailable' }); return; }
    var evt = installEvt; installEvt = null;
    evt.prompt();
    evt.userChoice.then(function (c) { tellApp({ kern: 'installResult', outcome: c.outcome }); }, function () { tellApp({ kern: 'installResult', outcome: 'unavailable' }); });
  }
});

/* ── 앱 안 브라우저(카카오톡·네이버·밴드 등) ──
   이런 화면에는 "홈 화면에 추가" 메뉴가 없고, 여기서 정한 로그인도 휴대폰 브라우저와 따로 저장됨.
   카카오톡이면 카톡이 제공하는 "외부 브라우저로 열기" 주소로 자동 전환(개인코드 ?k= 그대로),
   안 되거나 다른 앱이면 큰 글씨 안내. */
function inAppKind(ua) {
  ua = String(ua || '');
  if (/KAKAOTALK/i.test(ua)) return 'kakao';
  if (/NAVER\(inapp|NAVER\//i.test(ua)) return 'naver';
  if (/\bBAND\//i.test(ua)) return 'band';
  if (/Instagram|FBAN|FBAV|FB_IAB|\bLine\/|DaumApps|; wv\)/i.test(ua)) return 'other';
  return '';
}
var UA = navigator.userAgent;
var IS_IOS = /iPhone|iPad|iPod/.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
var IS_ANDROID = /Android/i.test(UA);
var go = window.kernGo || function (url) { location.href = url; }; // (검증할 때 kernGo로 바꿔 끼워 확인)
var APP_NAME = { kakao: '카카오톡', naver: '네이버 앱', band: '밴드', other: '이 앱' };
var STANDALONE = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
/* 안드로이드의 진짜 크롬인지. 삼성 인터넷 등 다른 브라우저로 홈 화면에 설치하면
   구글 플레이 프로텍트가 "안전하지 않은 앱"으로 막는 경고가 떠서, 안드로이드는 크롬으로 보냄 */
function isAndroidChrome(ua) {
  return /Android/i.test(ua) && /Chrome\/\d/.test(ua) &&
    !/SamsungBrowser|EdgA|OPR\/|Whale|YaBrowser|Firefox|DuckDuckGo|; wv\)|KAKAOTALK|NAVER|\bBAND\//i.test(ua);
}

function showChromeGuide() {
  document.getElementById('splash').style.display = 'none';
  document.getElementById('ia-title').textContent = '크롬으로 열어 주세요';
  document.getElementById('ia-step').textContent = '아래 [크롬으로 열기]를 누르세요';
  document.getElementById('ia-why').textContent = '이 브라우저로 홈 화면에 추가하면 "안전하지 않은 앱" 경고가 뜰 수 있습니다. 크롬으로 열면 경고 없이 추가됩니다.';
  document.getElementById('ia-my').textContent = 'Chrome ဖြင့် ဖွင့်ပါ။';
  var btn = document.getElementById('ia-go');
  btn.textContent = '크롬으로 열기'; btn.style.display = 'block';
  btn.onclick = function () { go(chromeIntent()); };
  document.getElementById('ia-stay').textContent = '이 브라우저로 계속 보기';
  document.getElementById('inapp').style.display = 'flex';
}

function showInAppGuide(kind) {
  var name = APP_NAME[kind] || '이 앱';
  document.getElementById('splash').style.display = 'none';
  document.getElementById('ia-title').textContent = name + ' 안에서는 홈 화면에 추가할 수 없어요';
  var step, my;
  if (IS_IOS) {
    step = '오른쪽 아래 ⋯(또는 공유) → "Safari로 열기"';
    my = 'Safari ဖြင့် ဖွင့်ပါ။';
  } else {
    step = '오른쪽 아래 ⋮ → "다른 브라우저로 열기"';
    my = '⋮ → အခြား browser ဖြင့် ဖွင့်ပါ။';
  }
  if (kind !== 'kakao' && !IS_IOS) step = '화면의 ⋮ 메뉴 → "다른 브라우저로 열기"';
  document.getElementById('ia-step').textContent = step;
  document.getElementById('ia-my').textContent = my;
  var btn = document.getElementById('ia-go');
  if (kind === 'kakao' && IS_IOS) {
    btn.textContent = 'Safari로 열기'; btn.style.display = 'block';
    btn.onclick = function () { go(kakaoExternal()); };
  } else if (IS_ANDROID) {
    btn.textContent = '크롬으로 열기'; btn.style.display = 'block';
    btn.onclick = function () { go(chromeIntent()); };
  }
  document.getElementById('inapp').style.display = 'flex';
}
/** 바깥 브라우저로 넘길 주소: 지금 주소 + (참석 QR로 들어왔으면) att도 다시 붙임 */
function outsideUrl() { return location.href + (ATT_IN ? (location.search ? '&' : '?') + 'att=' + ATT_IN : ''); }
function kakaoExternal() { return 'kakaotalk://web/openExternal?url=' + encodeURIComponent(outsideUrl()); }
/** 크롬으로 열기 (크롬이 없는 폰이면 지금 브라우저에서 그대로 열림) */
function chromeIntent() {
  var u = outsideUrl();
  return 'intent://' + u.replace(/^https?:\/\//, '') +
    '#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=' + encodeURIComponent(u) + ';end';
}

function startApp() {
  document.getElementById('inapp').style.display = 'none';
  document.getElementById('splash').style.display = 'flex';
  if (!APP_URL) { document.getElementById('splash-msg').textContent = '아직 준비 중입니다. 안전관리자에게 문의하세요.'; return; }
  var f = document.createElement('iframe');
  f.id = 'app'; f.src = APP_URL; f.allow = 'fullscreen; autoplay; encrypted-media';
  f.setAttribute('allowfullscreen', '');
  document.body.insertBefore(f, document.body.firstChild);
  // 웹앱이 응답 없이 오래 걸리면 안내
  setTimeout(function () {
    var s = document.getElementById('splash');
    if (s.style.display !== 'none') document.getElementById('splash-msg').textContent = '연결이 느립니다. 잠시만 기다리거나 인터넷 연결을 확인하세요.';
  }, 15000);
}
document.getElementById('ia-stay').onclick = function () { try { sessionStorage.setItem('kern_stay', '1'); } catch (e) {} startApp(); };

(function () {
  var kind = inAppKind(UA), stay = false, tried = false;
  try { stay = sessionStorage.getItem('kern_stay') === '1'; tried = sessionStorage.getItem('kern_ext') === '1'; } catch (e) {}
  if (stay || STANDALONE) { startApp(); return; } // 이미 홈 화면 아이콘으로 실행 중이면 그대로
  if (!kind) {
    // 앱 안 브라우저는 아니지만 안드로이드에서 크롬이 아닌 브라우저(삼성 인터넷 등) → 크롬 권유
    if (IS_ANDROID && !isAndroidChrome(UA)) showChromeGuide(); else startApp();
    return;
  }
  if (kind === 'kakao' && !tried) {
    // 카카오톡: 안드로이드는 크롬 → (안 되면) 카톡의 "외부 브라우저로 열기" → (그래도 안 되면) 안내
    //          아이폰은 카톡의 "외부 브라우저로 열기"(사파리) → (안 되면) 안내
    try { sessionStorage.setItem('kern_ext', '1'); } catch (e) {}
    var still = function () { return document.visibilityState === 'visible'; };
    if (IS_ANDROID) {
      go(chromeIntent());
      setTimeout(function () {
        if (!still()) return;
        go(kakaoExternal());
        setTimeout(function () { if (still()) showInAppGuide(kind); }, 1500);
      }, 1200);
    } else {
      go(kakaoExternal());
      setTimeout(function () { if (still()) showInAppGuide(kind); }, 1500);
    }
    return;
  }
  showInAppGuide(kind);
})();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
</body>
</html>
